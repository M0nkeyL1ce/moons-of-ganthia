<title>Moons of Ganthia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed night sky canvas; a brass-edged date plaque top-left, a moon roster at right, an observatory control strip along the bottom. Single dark look by design (it is the night sky). */
:root{
  color-scheme: dark;
  --sky:#05070d;
  --ink:#ebe5d4;
  --muted:#a29cb0;
  --panel:rgba(9,10,19,.78);
  --line:rgba(235,229,212,.14);
  --brass:#d6b26a;
  --brass-dim:rgba(214,178,106,.35);
  --font-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);font-size:15px;overflow:hidden;
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sky.drag{cursor:grabbing}
.overlay{position:absolute;pointer-events:none;inset:0;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:14px}
.overlay > *{pointer-events:auto}
.plaque{position:absolute;top:14px;left:max(16px, env(safe-area-inset-left,0px));background:var(--panel);
  border:1px solid var(--line);border-top:2px solid var(--brass-dim);padding:10px 14px 9px;border-radius:3px;backdrop-filter:blur(6px);max-width:min(78vw,380px)}
.plaque .kicker{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.plaque h1{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.1;margin:2px 0 3px;text-wrap:balance;color:var(--ink)}
.plaque .sub{font-family:var(--font-mono);font-size:12px;color:var(--brass);font-variant-numeric:tabular-nums}
.roster{position:absolute;top:14px;right:max(16px, env(safe-area-inset-right,0px));width:272px;background:var(--panel);border:1px solid var(--line);
  border-radius:3px;backdrop-filter:blur(6px);max-height:calc(100% - 210px);display:flex;flex-direction:column}
.roster header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:9px 12px 7px;border-bottom:1px solid var(--line)}
.roster header h2{font-family:var(--font-display);font-weight:400;font-size:17px;margin:0}
.roster header span{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#moonList{list-style:none;margin:0;padding:4px 0;overflow:auto}
#moonList li{min-width:0}
#moonList button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:6px 12px;cursor:pointer}
#moonList button:hover{background:rgba(235,229,212,.06)}
#moonList button:focus-visible{outline:1px solid var(--brass);outline-offset:-1px}
#moonList canvas{width:26px;height:26px}
.mname{font-weight:700;font-size:14px;line-height:1.15;display:flex;gap:6px;align-items:center}
.mname .tag{font-family:var(--font-mono);font-weight:500;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#14110a;background:var(--brass);padding:1px 5px;border-radius:2px}
.mname .tag.ecl{background:#b5523b;color:#fff3ea}
.mmeta{font-size:12px;color:var(--muted);line-height:1.2}
.mnum{font-family:var(--font-mono);font-size:11px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.35}
.mnum .down{color:var(--muted)}
.dock{position:absolute;left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:3px;backdrop-filter:blur(6px);padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{all:unset;box-sizing:border-box;font-family:var(--font-body);font-size:13px;font-weight:500;padding:5px 10px;border:1px solid var(--line);border-radius:2px;cursor:pointer;color:var(--ink);background:rgba(235,229,212,.04);white-space:nowrap}
.btn:hover{border-color:var(--brass-dim)}
.btn:focus-visible{outline:1px solid var(--brass)}
.btn[aria-pressed="true"]{background:var(--brass);color:#16120a;border-color:var(--brass)}
#play{min-width:74px;text-align:center;font-weight:700}
.seg{display:inline-flex}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:2px 0 0 2px;margin-left:0}
.seg .btn:last-child{border-radius:0 2px 2px 0}
.slider{display:flex;align-items:center;gap:8px;min-width:0}
.slider input{width:150px;accent-color:var(--brass)}
.slider output{font-family:var(--font-mono);font-size:12px;min-width:52px;font-variant-numeric:tabular-nums;color:var(--brass)}
select{font-family:var(--font-body);font-size:13px;background:#12131f;color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:4px 6px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--brass)}
#mini{position:absolute;right:max(16px, env(safe-area-inset-right,0px));width:150px;height:150px;cursor:crosshair}
.note{font-size:12px;color:var(--muted);max-width:60ch}
#rosterToggle{display:none}
@media (max-width: 760px){
  .plaque h1{font-size:21px}
  .roster{width:auto;left:max(16px, env(safe-area-inset-left,0px));top:auto;bottom:auto}
  .roster[hidden]{display:none!important}
  #rosterToggle{display:inline-block}
  .slider input{width:110px}
  #mini{width:110px;height:110px}
  .dock{gap:8px 12px;padding:8px 10px}
}

#app[data-view="orrery"] .sky-only, #app[data-view="map"] .sky-only,
#app[data-view="orrery"] .not-orrery, #app[data-view="map"] .not-map,
#app:not([data-view="map"]) .map-only, #app:not([data-view="orrery"]) .orrery-only{display:none!important}
#app[data-view="map"] #mini{display:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#moonList li.off{opacity:.55}
#lureCtl[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

      </div>
      <div class="group">
        <span class="lbl sky-only">Moon size</span>

        </div>

          <button class="btn" data-orbscale="accurate" type="button" aria-pressed="false">Accurate</button>

          <button class="btn" data-mapmode="globe" type="button" aria-pressed="true">Globe</button>
          <button class="btn" data-mapmode="flat" type="button" aria-pressed="false">Flat</button>
        </div>
        <label class="btn map-only filebtn">Load world map<input id="mapFile" type="file" accept="image/*"></label>
        <label class="slider map-only"><span class="lbl">Shift</span><input id="mapShift" type="range" min="-180" max="180" step="1" value="0"><output id="mapShiftOut">0°</output></label>
      </div>
      <div class="group">
        <label class="chk"><input type="checkbox" id="optLabels" checked> Labels</label>
        <label class="chk sky-only"><input type="checkbox" id="optSun" checked> Sun</label>
        <label class="chk sky-only"><input type="checkbox" id="optGrid"> Alt/az grid</label>
        <label class="chk not-map"><input type="checkbox" id="optBronze"> Bronze debris</label>
        <label class="chk"><input type="checkbox" id="optAmber"> Amber Moon (9179)</label>
        <label class="slider" id="lureCtl" hidden title="Net Moon Lure total: pulls minus pushes. 30 = impact."><span class="lbl">Moon Lure</span><input id="lure" type="range" min="0" max="34" step="0.5" value="0"><output id="lureOut" style="min-width:150px">0 · misses by 178k km</output></label>
      </div>
    </div>
  </div>
</div>
<script>
// ---- Ganthian sky core (pure math) ----
const DEG = Math.PI/180;
const YEAR = 400, EPS = 23.4*DEG;
const A_KM = 2.30e6, PERI_KM = 1.78e5, ECC = 1 - PERI_KM/A_KM, MOON_R = 806; // 1/10 the volume of Earth's Moon (1737 km × 0.1^(1/3))
const R_PLANET = 6371, R_SUN = 696000, D_SUN = 1.5e8;
const MOONS = [
  {key:'black',  name:'Black',  month:'Blackmoon',  school:'Necromancy',    color:[52,47,62],   rim:[160,140,205], inc:49.714, sgn: 1, present:true},
  {key:'blue',   name:'Blue',   month:'Bluemoon',   school:'Transmutation', color:[86,148,240], inc:18, sgn:-1, present:true},
  {key:'green',  name:'Green',  month:'Greenmoon',  school:'Conjuration',   color:[92,196,112], inc:40, sgn: 1, present:true},
  {key:'gold',   name:'Gold',   month:'Goldmoon',   school:'Abjuration',    color:[243,200,80], inc:75, sgn:-1, present:true},
  {key:'fifth',  name:'Amber',  month:'Fifthmoon',  school:'(lost)',        color:[255,150,50], inc:30, sgn: 1, present:false},
  {key:'red',    name:'Red',    month:'Redmoon',    school:'Evocation',     color:[236,78,64],  inc:52.994, sgn: 1, present:true},
  {key:'silver', name:'Silver', month:'Silvermoon', school:'Enchantment',   color:[202,206,216],inc:55, sgn: 1, present:true},
  {key:'eighth', name:'Bronze', month:'Eighthmoon', school:'(shattered)',   color:[184,135,74], inc:47, sgn:-1, present:false},
  {key:'white',  name:'White',  month:'Whitemoon',  school:'Divination',    color:[246,243,234],inc:12, sgn: 1, present:true},
  {key:'violet', name:'Violet', month:'Violetmoon', school:'Illusion',      color:[166,112,242],inc:80, sgn:-1, present:true},
];
function sunLon(t){ return (270 + 0.9*t)*DEG; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function norm(a){ const l=Math.hypot(a[0],a[1],a[2]); return [a[0]/l,a[1]/l,a[2]/l]; }
function makeOrbit(lp, incDeg, sgn){
  const P=[Math.cos(lp),Math.sin(lp),0], i=incDeg*DEG*sgn;
  const N=[Math.sin(i)*P[1], -Math.sin(i)*P[0], Math.cos(i)];
  return {P, Q:cross(N,P)};
}
MOONS.forEach((m,k)=>{ m.tp = 40*k + 22.5; Object.assign(m, makeOrbit(sunLon(m.tp)+Math.PI, m.inc, m.sgn)); });
function kepler(M,e){ let E = M + e*Math.sin(M); for(let n=0;n<8;n++){ E -= (E - e*Math.sin(E) - M)/(1 - e*Math.cos(E)); } return E; }
function orbitPos(o, tp, t, e=ECC, a=A_KM){
  let M = 2*Math.PI*((t-tp)/YEAR); M = Math.atan2(Math.sin(M),Math.cos(M));
  const E = kepler(M,e), x = a*(Math.cos(E)-e), y = a*Math.sqrt(1-e*e)*Math.sin(E);
  return [o.P[0]*x+o.Q[0]*y, o.P[1]*x+o.Q[1]*y, o.P[2]*x+o.Q[2]*y];
}
function sunVec(t){ const l=sunLon(t); return [Math.cos(l),Math.sin(l),0]; }
const cE=Math.cos(EPS), sE=Math.sin(EPS);
function eclToEq(v){ return [v[0], v[1]*cE - v[2]*sE, v[1]*sE + v[2]*cE]; }
function lst(t){ return (90 + 360.9*t)*DEG; }
function frame(t, latDeg){ const th=lst(t), ph=latDeg*DEG; return {ct:Math.cos(th), st:Math.sin(th), cp:Math.cos(ph), sp:Math.sin(ph)}; }
// equatorial -> local [East, North, Up]
function eqToLocal(v, F){
  const f0 = v[0]*F.ct + v[1]*F.st, f1 = -v[0]*F.st + v[1]*F.ct, f2 = v[2];
  return [f1, -F.sp*f0 + F.cp*f2, F.cp*f0 + F.sp*f2];
}
function altAz(L){ return {alt:Math.asin(Math.max(-1,Math.min(1,L[2])))/DEG, az:((Math.atan2(L[0],L[1])/DEG)+360)%360}; }
// shadow factor 0..1 (1 = fully lit by sun)
function shadowFactor(rvec, S){
  const d=Math.hypot(rvec[0],rvec[1],rvec[2]); const u=[rvec[0]/d,rvec[1]/d,rvec[2]/d];
  const sep=Math.acos(Math.max(-1,Math.min(1,-dot(u,S))));
  const um=(R_PLANET - d*(R_SUN-R_PLANET)/D_SUN)/d, pen=(R_PLANET + d*(R_SUN+R_PLANET)/D_SUN)/d, mr=MOON_R/d;
  if(sep >= pen+mr) return 1;
  if(um>0 && sep <= um-mr) return 0;
  const lo = Math.max(0, um), x=(sep - lo)/((pen+mr)-lo);
  return Math.max(0,Math.min(1,x));
}
function moonState(m, t){
  const r = orbitPos(m, m.tp, t), d=Math.hypot(r[0],r[1],r[2]), S=sunVec(t);
  const u=[r[0]/d,r[1]/d,r[2]/d], cosPhi = -dot(S,u);
  return {r, d, u, cosPhi, frac:(1+cosPhi)/2, shadow:shadowFactor(r,S)};
}
const UMBRA_LEN = R_PLANET*D_SUN/(R_SUN-R_PLANET);
if (typeof module!=='undefined') module.exports={PERI_KM,makeOrbit,sunLon,MOONS,moonState,sunVec,eclToEq,frame,eqToLocal,altAz,YEAR,ECC,A_KM,orbitPos,DEG};

// ---- Ganthian sky viewer: Sky, Orrery, Ley lines ----
(function(){
const $ = id => document.getElementById(id);
const app = $('app'), sky = $('sky'), ctx = sky.getContext('2d');
const mini = $('mini'), mctx = mini.getContext('2d');
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const TRUE_DIAM = 2*MOON_R/PERI_KM/DEG;                 // closest moon, true apparent diameter (deg)
const SIZE_MODES = { true: 1, story: 2.5/TRUE_DIAM };
const EARTH_MOON_R = 0.259*DEG;                           // Earth's Moon apparent radius, for the scale ring
const DIROLE_LAT = 40;
const SPEED_RANGE = { night: [1/60, 240], year: [0.25, 30] };  // hours per second / nights per second
function speedVal(mode){ const [lo,hi] = SPEED_RANGE[mode], x = state.speedX[mode]/100; return Math.pow(10, Math.log10(lo) + (Math.log10(hi)-Math.log10(lo))*x); }
function speedLabel(mode){ const v = speedVal(mode);
  if(mode==='year') return `${v < 1 ? v.toFixed(2) : v < 10 ? v.toFixed(1) : Math.round(v)} night${v===1?'':'s'}/s`;
  if(v < 1) return `${Math.max(1,Math.round(v*60))} min/s`; if(v < 24) return `${v < 10 ? v.toFixed(1) : Math.round(v)} hr/s`; const d = v/24; return `${d < 10 ? d.toFixed(1) : Math.round(d)} days/s`; }

const state = {
  view:'sky', t: 102.0, lat: DIROLE_LAT, yaw: 180*DEG, pitch: 28*DEG, fov: 100*DEG,
  mode: 'night', playing: !reduceMotion, speedX: {night:43, year:58}, reverse: false,
  size: 'true', fixedHour: 0, dayAcc: 102,
  orb: {az: -60*DEG, el: 28*DEG, dist: 11},
  mapShift: 0, mapImg: null, mapFocus: null, mapMode: 'globe', lure: 0, year: 9179, orbScale: 'enlarged',
  opt: {labels:true, sun:true, grid:false, bronze:false, amber:false}
};

// ---------- deterministic star field ----------
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(9179);
function randDir(){ const z = 2*R()-1, a = 2*Math.PI*R(), s = Math.sqrt(1-z*z); return [s*Math.cos(a), s*Math.sin(a), z]; }
const stars = [];
for(let i=0;i<2600;i++){
  const b = Math.pow(R(), 5.5), tint = R();
  const col = tint < .18 ? [190,210,255] : tint > .86 ? [255,214,170] : [245,244,236];
  stars.push({v:randDir(), b, col, tw: R()*6.28});
}
const band = [];
{ const gp = norm([Math.cos(192*DEG)*Math.cos(27*DEG), Math.sin(192*DEG)*Math.cos(27*DEG), Math.sin(27*DEG)]);
  const e1 = norm(cross(gp,[0,0,1])), e2 = cross(gp,e1);
  for(let i=0;i<3200;i++){
    const a = 2*Math.PI*R(); let g = 0; for(let k=0;k<4;k++) g += R(); g = (g-2)*7*DEG*(0.6+0.8*Math.abs(Math.sin(a*1.7)));
    const ca=Math.cos(a), sa=Math.sin(a), cg=Math.cos(g), sg=Math.sin(g);
    band.push({v:[ (e1[0]*ca+e2[0]*sa)*cg + gp[0]*sg, (e1[1]*ca+e2[1]*sa)*cg + gp[1]*sg, (e1[2]*ca+e2[2]*sa)*cg + gp[2]*sg ], b: 0.05 + 0.18*R()});
  }
}
// Bronze Moon debris: spread along the old orbit (uniform in mean anomaly, so the belt is fixed among the stars)
const bronzeBase = MOONS[7];
const debris = [];
for(let i=0;i<700;i++){
  const lp = sunLon(bronzeBase.tp) + Math.PI + (R()-.5)*3*DEG;
  const o = makeOrbit(lp, bronzeBase.inc + (R()-.5)*4, bronzeBase.sgn);
  const e = ECC + (R()-.5)*0.012;
  const r = orbitPos(o, 0, R()*YEAR, e);
  const d = Math.hypot(r[0],r[1],r[2]);
  debris.push({r, d, eq: eclToEq([r[0]/d, r[1]/d, r[2]/d]), b: 0.4 + 0.6*R()});
}
function hill(azDeg){ const a = azDeg*DEG; return 1.3 + 0.9*Math.sin(3*a+.4) + 0.6*Math.sin(7*a+1.1) + 0.35*Math.sin(17*a+2) + 0.25*Math.sin(29*a); }

// Amber Moon: on a ~1,000-year orbit around the sun (semi-major axis 100× Ganthia's), modelled as a real orbit.
// Solved so that (a) it was full, opposite the sun, when Sinclair saw it on the 39th of Greenmoon 9179, and
// (b) on its natural path (no Moon Lure pulls) it passes 178,000 km from the planet's centre, directly over Dirole
// at about 4 PM on the 40th of Violetmoon, just before sunset. Relative speed 31.4 km/s. Planet gravity is ignored

// Amber Moon tag: always labelled while it is switched on, even when too faint to see, in daylight,
// below the horizon (tag sits on the horizon) or outside the view (tag pins to the screen edge).
function drawAmberTag(sc, drawn, dayness){
  const b = sc.bodies.find(x=>x.amber); if(!b || b.hidden) return;
  const vis = drawn.find(d=>d.b===b);
  const below = b.aa.alt < hill(b.aa.az);
  let L = b.L, note = '';
  if(below){ const h = hill(b.aa.az)+1.5, ca = Math.cos(h*DEG); L = [Math.sin(b.aa.az*DEG)*ca, Math.cos(b.aa.az*DEG)*ca, Math.sin(h*DEG)]; note = 'below horizon'; }

  const m = 26;

    // pin to the screen edge in the moon's direction

    const sx = (W/2 - m)/Math.max(1e-6, Math.abs(ux)), sy = (H/2 - m)/Math.max(1e-6, Math.abs(uy)), s = Math.min(sx, sy);

  } else if(!vis){
    ctx.save(); ctx.strokeStyle = rgba(col,.75); ctx.lineWidth = 1; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.arc(p.x,p.y,6,0,Math.PI*2); ctx.stroke(); ctx.restore();

  ctx.font = '400 14px "IM Fell English SC", Georgia, serif'; ctx.textBaseline = 'middle';

  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(5,7,13,0.65)'; ctx.fillText(text, tx+1, ty+1);

// =================== LEY-LINE MAP ===================
// Ley line: the track of points directly under a moon during its five closest days (21st–25th of its month).
// Longitude 0 is Dirole's meridian.

// The line fades out over the last half-day at each end, as it narrows toward 1 mile.
const leyLines = MOONS.map(m=>{

  const pts=[]; for(let t=m.tp-2.5; t<=m.tp+2.5+1e-9; t+=0.008){ const s=moonState(m,t); const q=subPoint(eclToEq(s.u), t); q.wMi = dEdge/s.d; q.a = smooth(1, wFull, q.wMi); pts.push(q); }

// =================== GLOBE (ley lines on a rotatable planet) ===================
const globe = {lon0: 0, lat0: 28, zoom: 1, cx:0, cy:0, R:100, c:[1,0,0], e:[0,1,0], n:[0,0,1]};

function setTexture(im){

function llVec(lat, lon){ const a=lat*DEG, b=lon*DEG, ca=Math.cos(a); return [ca*Math.cos(b), ca*Math.sin(b), Math.sin(a)]; }
function setGlobeCamera(){

function globeLayout(){
  const plaque = document.querySelector('.plaque').getBoundingClientRect(), appR = app.getBoundingClientRect(), dock = $('dock').getBoundingClientRect();

  const dp = dateParts(sc.t);
  const title = `${ordinal(dp.day)} of ${MOONS[dp.mi].month}`;
  const sub = state.view==='sky' ? `${clock(sc.t)} · ${state.year} CR · ${latStr(state.lat)} · facing ${facing(state.yaw)}` : `${clock(sc.t)} at Dirole · ${state.year} CR · day ${dp.doy} of 400`;
  if(title!==lastTitle){ $('dateTitle').textContent = title; lastTitle = title; }
  if(sub!==lastSub){ $('dateSub').textContent = sub; lastSub = sub; }
  $('kicker').textContent = KICKERS[state.view];
  const now = performance.now();
  if(now - lastTextT < 220) return; lastTextT = now;
  for(const r of rows){
    const b = sc.bodies.find(x=>x.m===r.m); if(!b) continue;
    drawPhaseIcon(r.cv, r.m, b.s.cosPhi, b.s.shadow);
    let tags = '';
    if(sc.closest === b) tags += '<span class="tag">closest</span>';
    if(b.s.shadow < .97 && !(b.amber && b.s.impact)) tags += '<span class="tag ecl">eclipse</span>';
    if(r.tags.innerHTML !== tags) r.tags.innerHTML = tags;
    r.li.classList.toggle('off', !!b.hidden);
    const up = b.aa.alt > hill(b.aa.az);
    const third = (b.amber && b.s.impact) ? '<span class="down">impact</span>' : b.hidden ? '<span class="down">hidden</span>' : up ? Math.round(b.aa.alt)+'° up' : '<span class="down">below</span>';
    r.num.innerHTML = `${Math.round(b.s.frac*100)}% lit<br>${fmtDist(b.s.d)}<br>${third}`;
    r.btn.setAttribute('aria-label', `${r.m.name} Moon, ${Math.round(b.s.frac*100)} percent lit, ${b.hidden ? 'hidden; select to show' : up?'altitude '+Math.round(b.aa.alt)+' degrees':'below the horizon'}. Look at it.`);
  }
  syncSliders();
}
function syncSliders(){
  const dp = dateParts(state.t);
  if(document.activeElement !== $('day')){ $('day').value = dp.doy; }
  $('dayOut').textContent = `${ordinal(dp.day)} ${MOONS[dp.mi].month}`;
  const h = state.mode==='year' ? state.fixedHour : (state.t - Math.floor(state.t))*24;
  if(document.activeElement !== $('hour')){ $('hour').value = (Math.round(h*4)/4) % 24; }
  $('hourOut').textContent = clock(Math.floor(state.t) + h/24).replace(':00 ',' ');
}
function aimAt(key){
  const sc = computeScene(); const b = sc.bodies.find(x=>x.m.key===key); if(!b) return;
  if(state.view==='sky'){ state.yaw = b.aa.az*DEG; state.pitch = Math.max(4, Math.min(80, b.aa.alt))*DEG; }
  else if(state.view==='orrery'){ const r=b.s.r; state.orb.az = Math.atan2(r[1], r[0]) + 0.5; }
  else { state.mapFocus = state.mapFocus===key ? null : key; if(state.mapFocus && state.mapMode==='globe'){ const k = MOONS.findIndex(m=>m.key===key); if(k>=0){ const pp = leyLines[k].per; globe.lon0 = pp.lon; globe.lat0 = Math.max(-60, Math.min(60, pp.lat)); } } }
  requestDraw();
}

// ---------- controls ----------
const speedSel = $('speed');
function fillSpeeds(){ speedSel.value = state.speedX[state.mode]; $('speedOut').textContent = speedLabel(state.mode); }
fillSpeeds();
speedSel.addEventListener('input', ()=>{ state.speedX[state.mode] = +speedSel.value; $('speedOut').textContent = speedLabel(state.mode); });
$('reverse').addEventListener('click', ()=>{ state.reverse = !state.reverse; $('reverse').setAttribute('aria-pressed', state.reverse); });
function nudgeSpeed(dx){ state.speedX[state.mode] = Math.max(0, Math.min(100, state.speedX[state.mode] + dx)); fillSpeeds(); }
function setPlaying(p){ state.playing = p; $('play').textContent = p ? 'Pause' : 'Play'; if(p){ lastFrame = performance.now(); } requestDraw(); }
$('play').addEventListener('click', ()=>setPlaying(!state.playing));
function setMode(mode){
  state.mode = mode;
  $('modeNight').setAttribute('aria-pressed', mode==='night'); $('modeYear').setAttribute('aria-pressed', mode==='year');
  if(mode==='year'){ state.fixedHour = Math.round(((state.t - Math.floor(state.t))*24)*4)/4; state.dayAcc = Math.floor(state.t); }
  fillSpeeds(); requestDraw();
}
$('modeNight').addEventListener('click', ()=>setMode('night'));
$('modeYear').addEventListener('click', ()=>setMode('year'));
document.querySelectorAll('[data-view]').forEach(b=>{ if(b.tagName!=='BUTTON') return; b.addEventListener('click', ()=>{
  state.view = b.dataset.view; app.dataset.view = state.view;
  document.querySelectorAll('button[data-view]').forEach(x=>x.setAttribute('aria-pressed', x===b));
  sky.style.cursor = (state.view==='map' && state.mapMode!=='globe') ? 'default' : '';
  try{ location.hash = state.view; }catch(e){}
  layout();
}); });
$('day').addEventListener('input', e=>{ const d = +e.target.value - 1, h = state.mode==='year' ? state.fixedHour/24 : state.t - Math.floor(state.t); state.t = d + h; state.dayAcc = d; lastTextT = -1; requestDraw(); });
$('hour').addEventListener('input', e=>{ const h = +e.target.value % 24; state.fixedHour = h; state.t = Math.floor(state.t) + h/24; lastTextT = -1; requestDraw(); });
$('lat').addEventListener('input', e=>{ state.lat = +e.target.value; $('latOut').textContent = latStr(state.lat); requestDraw(); });
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click', ()=>{ state.size = b.dataset.size; document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed', x===b)); requestDraw(); }));
[['optLabels','labels'],['optSun','sun'],['optGrid','grid'],['optBronze','bronze'],['optAmber','amber']].forEach(([id,k])=>$(id).addEventListener('change', e=>{ state.opt[k] = e.target.checked; syncLure(); requestDraw(); }));
function syncLure(){
  $('lureCtl').hidden = !state.opt.amber;
  const m = amberMiss(), L = state.lure;
  $('lureOut').textContent = L >= 30 ? `${L} · impact` : `${L} · misses by ${m >= 1e4 ? Math.round(m/1e3)+'k' : Math.round(m)} km`;
}
$('lure').addEventListener('input', e=>{ state.lure = +e.target.value; syncLure(); requestDraw(); });
syncLure();
$('mapShift').addEventListener('input', e=>{ state.mapShift = +e.target.value; $('mapShiftOut').textContent = `${state.mapShift}°`; requestDraw(); });
$('mapFile').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = ()=>{ state.mapImg = im; setTexture(im); requestDraw(); };
  im.src = url;
});
document.querySelectorAll('[data-mapmode]').forEach(b=>b.addEventListener('click', ()=>{ state.mapMode = b.dataset.mapmode; document.querySelectorAll('[data-mapmode]').forEach(x=>x.setAttribute('aria-pressed', x===b)); sky.style.cursor = state.mapMode==='globe' ? '' : 'default'; requestDraw(); }));
function orbMinDist(){ return state.orbScale === 'accurate' ? 0.03 : 1.2; }
document.querySelectorAll('[data-orbscale]').forEach(b=>b.addEventListener('click', ()=>{ state.orbScale = b.dataset.orbscale; document.querySelectorAll('[data-orbscale]').forEach(x=>x.setAttribute('aria-pressed', x===b)); state.orb.dist = Math.max(orbMinDist(), state.orb.dist); requestDraw(); }));
const jump = $('jump');
MOONS.forEach((m,k)=>{ if(!m.present) return; const o=document.createElement('option'); o.value=k; o.textContent=`${m.name}: midnight, 23rd of ${m.month}`; jump.append(o); });
{ const o=document.createElement('option'); o.value='amber'; o.textContent='Amber: 2 PM, 40th of Violetmoon (overhead Dirole about 4 PM)'; jump.append(o); }
jump.addEventListener('change', ()=>{
  if(jump.value==='') return;
  if(jump.value==='amber'){ state.opt.amber = true; $('optAmber').checked = true; syncLure(); state.year = 9179; state.t = 399.5833; state.dayAcc = 399; state.fixedHour = 14; aimAt('amber'); }
  else { const k = +jump.value; state.t = 40*k + 22; state.dayAcc = 40*k + 22; state.fixedHour = 0; if(state.view==='map') state.mapFocus = null; aimAt(MOONS[k].key); }
  jump.value=''; requestDraw();
});
const rosterBtn = $('rosterToggle');
rosterBtn.addEventListener('click', ()=>{ roster.hidden = !roster.hidden; rosterBtn.setAttribute('aria-expanded', !roster.hidden); rosterBtn.setAttribute('aria-pressed', !roster.hidden); layout(); });
document.addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input,select,textarea')) return;
  if(e.code==='Space'){ e.preventDefault(); setPlaying(!state.playing); }
  if(e.key==='[' || e.key==='-'){ nudgeSpeed(-5); }
  if(e.key===']' || e.key==='=' || e.key==='+'){ nudgeSpeed(5); }
  if(e.key==='ArrowRight'){ state.t = (state.t + 0.25/24 + YEAR) % YEAR; requestDraw(); }
  if(e.key==='ArrowLeft'){ state.t = (state.t - 0.25/24 + YEAR) % YEAR; requestDraw(); }
});
const ptrs = new Map(); let pinch0 = 0, fov0 = 0, dist0 = 0, zoom0 = 1;
sky.addEventListener('pointerdown', e=>{ if(state.view==='map' && state.mapMode!=='globe') return; sky.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); sky.classList.add('drag');
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0 = Math.hypot(a.x-b.x,a.y-b.y); fov0 = state.fov; dist0 = state.orb.dist; zoom0 = globe.zoom; } });
sky.addEventListener('pointermove', e=>{
  const prev = ptrs.get(e.pointerId); if(!prev) return;
  const cur = {x:e.clientX, y:e.clientY}; ptrs.set(e.pointerId, cur);
  if(ptrs.size===1){
    if(state.view==='sky'){ const scale = K/2; state.yaw -= (cur.x-prev.x)/scale; state.pitch = Math.max(-8*DEG, Math.min(89*DEG, state.pitch + (cur.y-prev.y)/scale)); }
    else if(state.view==='map'){ globe.lon0 -= (cur.x-prev.x)/globe.R/DEG; globe.lat0 = Math.max(-89, Math.min(89, globe.lat0 + (cur.y-prev.y)/globe.R/DEG)); }
    else { state.orb.az -= (cur.x-prev.x)*0.006; state.orb.el = Math.max(-85*DEG, Math.min(85*DEG, state.orb.el + (cur.y-prev.y)*0.006)); }
  } else if(ptrs.size===2 && pinch0>0){ const [a,b]=[...ptrs.values()]; const r = pinch0/Math.hypot(a.x-b.x,a.y-b.y);
    if(state.view==='sky') state.fov = Math.max(6*DEG, Math.min(160*DEG, fov0*r)); else if(state.view==='map') globe.zoom = Math.max(.6, Math.min(4, zoom0/r)); else state.orb.dist = Math.max(orbMinDist(), Math.min(40, dist0*r)); }
  requestDraw();
});
const endPtr = e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=0; if(!ptrs.size) sky.classList.remove('drag'); };
sky.addEventListener('pointerup', endPtr); sky.addEventListener('pointercancel', endPtr);
sky.addEventListener('wheel', e=>{ if(state.view==='map' && state.mapMode!=='globe') return; e.preventDefault(); const f = Math.exp(e.deltaY*0.0012);
  if(state.view==='map'){ globe.zoom = Math.max(.6, Math.min(4, globe.zoom/f)); requestDraw(); return; }
  if(state.view==='sky') state.fov = Math.max(6*DEG, Math.min(160*DEG, state.fov*f)); else state.orb.dist = Math.max(orbMinDist(), Math.min(40, state.orb.dist*f)); requestDraw(); }, {passive:false});
mini.addEventListener('click', e=>{
  if(state.view!=='sky') return;
  const r = mini.getBoundingClientRect(), s = mini.width, c=s/2, Rr=s/2-18;
  const x = (e.clientX-r.left)*s/r.width - c, y = (e.clientY-r.top)*s/r.height - c;
  const rr = Math.min(Rr, Math.hypot(x,y)); const alt = 90 - 90*rr/Rr; const az = Math.atan2(-x, -y)/DEG;
  state.yaw = az*DEG; state.pitch = Math.max(2, Math.min(85, alt))*DEG; requestDraw();
});

// ---------- layout & loop ----------
function layout(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = sky.clientWidth; H = sky.clientHeight;
  sky.width = Math.round(W*DPR); sky.height = Math.round(H*DPR);
  const appR = app.getBoundingClientRect(), dock = $('dock').getBoundingClientRect(), plaque = document.querySelector('.plaque').getBoundingClientRect();
  const miniSize = mini.getBoundingClientRect().height || 150;
  const miniTop = dock.top - appR.top - 10 - miniSize;
  mini.style.top = miniTop + 'px';
  const narrow = window.innerWidth <= 760;
  if(narrow){ roster.style.top = (plaque.bottom - appR.top + 8) + 'px'; roster.style.maxHeight = Math.max(120, dock.top - plaque.bottom - 16) + 'px'; }
  else { roster.style.top = ''; roster.style.maxHeight = Math.max(160, (state.view==='map' ? dock.top - appR.top - 14 : miniTop) - 24) + 'px'; }
  requestDraw();
}
function draw(){
  const sc = computeScene(); lastScene = sc;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(state.view==='sky') drawSky(sc); else if(state.view==='orrery') drawOrrery(sc); else if(state.mapMode==='globe') drawGlobe(sc); else drawMap(sc);
  if(sc.amberImpact) drawImpact(sc);
  if(state.view!=='map') drawMini(sc);
  updateText(sc);
}
if(window.innerWidth <= 760){ roster.hidden = true; }
let pending = false, lastFrame = performance.now();
function requestDraw(){ if(!pending){ pending = true; requestAnimationFrame(tick); } }
function tick(now){
  pending = false;
  const dt = Math.min(0.1, (now - lastFrame)/1000); lastFrame = now;
  if(state.playing){
    const dir = state.reverse ? -1 : 1;
    // carry the year when the calendar wraps either way
    const wrap = v => { if(v >= YEAR){ state.year++; return v - YEAR; } if(v < 0){ state.year--; return v + YEAR; } return v; };
    if(state.mode==='night'){ state.t = wrap(state.t + dir*speedVal('night')/24*dt); }
    else { state.dayAcc = wrap(state.dayAcc + dir*speedVal('year')*dt); state.t = Math.floor(state.dayAcc) + state.fixedHour/24; }
  }
  draw();
  if(state.playing || starTwinkle()) requestDraw();
}
function starTwinkle(){ return !reduceMotion && state.view==='sky' && lastScene && (!state.opt.sun || lastScene.sunAA.alt < -5); }
window.addEventListener('resize', layout);
$('play').textContent = state.playing ? 'Pause' : 'Play';
$('latOut').textContent = latStr(state.lat);
const h0 = (location.hash||'').slice(1);
if(['orrery','map'].includes(h0)){ const b=document.querySelector(`button[data-view="${h0}"]`); if(b) requestAnimationFrame(()=>b.click()); }
requestAnimationFrame(()=>{ layout(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ lastTitle=''; requestDraw(); });
})();

</script>
